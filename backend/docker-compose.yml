services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artesanfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artesanfc}
      POSTGRES_DB: ${POSTGRES_DB:-artesanfc}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artesanfc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    # DATABASE_URL (and APP_ENV) come only from .env: there is deliberately no
    # `environment:` fallback here. With no DATABASE_URL the api container
    # refuses to start (Settings fails closed, app/core/config.py) instead of
    # silently using an implicit database. Not `${DATABASE_URL:?...}`: that is
    # evaluated for the whole file and would also break `docker compose up db`.
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
