name: Web CI

# Validation of the Astro public frontend in web/ (migration target of
# frontend/, see web/README.md). No deployment, no secrets, no network access
# to the real API: e2e tests intercept the API with contract fixtures.
on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Asset budgets
        run: npm run measure:assets

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + mobile)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
