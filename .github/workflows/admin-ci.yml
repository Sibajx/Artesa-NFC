name: Admin CI

# Validation of the Gestión UI in admin/ (ADR-029). No deployment, no secrets,
# no network access to the real API.
on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "admin/**"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

jobs:
  admin:
    name: admin
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The prototype stored data in localStorage and faked login and
      # certificate hashes (Brain B-026). None of that may come back.
      # One narrow exception, decided by the PO (2026-10-10): src/theme.ts may keep
      # the light/dark choice under the key "artesa-theme" (a display preference,
      # never a session or data). Nothing else may touch localStorage.
      - name: No client-side storage, fake auth or client-generated hashes
        run: |
          if grep -rnE "sessionStorage|getRandomValues|isAuthenticated" src; then
            echo "forbidden client-side pattern found"; exit 1
          fi
          if grep -rnE "localStorage" src --exclude=theme.ts; then
            echo "localStorage is only allowed in src/theme.ts (theme choice)"; exit 1
          fi
          if grep -nE "localStorage\.[a-zA-Z]+\(" src/theme.ts | grep -v "KEY"; then
            echo "src/theme.ts may only use the theme key"; exit 1
          fi
