# Dependency updates (Brain: infraestructura punto 3, 2026-10-05).
#
# npm (admin/, web/) and GitHub Actions: grouped, monthly PRs into develop,
# validated by the usual CI before anyone merges them.
#
# Python is NOT here on purpose: requirements.txt, requirements-prod.in and
# the hashed requirements-prod.lock must stay in lockstep (a test enforces it,
# and release-ci checks the lock is reproducible), which Dependabot cannot do.
# Python is covered by .github/workflows/security-audit.yml (pip-audit) and
# updated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /admin
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint 8 does not accept TypeScript 7 yet (peer conflict,
      # PR #219). Lift when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      admin-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # @google/model-viewer pins its peer three@^0.183 (PR #218); three moves
      # only together with model-viewer.
      - dependency-name: three
      # eslint-plugin-jsx-a11y does not accept eslint 10 yet (PRs #220, #222);
      # eslint and @eslint/js must move together when it does.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
